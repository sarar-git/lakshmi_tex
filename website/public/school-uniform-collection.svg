<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Matching school sportswear collection — jersey, shorts and track pants">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5F3"/>
      <stop offset="1" stop-color="#E4E8E3"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6E3E"/>
      <stop offset="1" stop-color="#245D32"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect y="620" width="600" height="180" fill="url(#grass)"/>
  <circle cx="480" cy="120" r="140" fill="#D2EF50" opacity="0.35"/>
  <!-- jersey -->
  <g transform="translate(150,90)">
    <path d="M100 0 60 24 0 66l44 40 24-18v190h112V88l24 18 44-40L140 24z" fill="#FFFFFF" stroke="#D6D5D9" stroke-width="3"/>
    <path d="M60 24c10 22 70 22 80 0" fill="none" stroke="#245D32" stroke-width="8"/>
    <rect x="44" y="120" width="112" height="10" fill="#D2EF50"/>
    <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#245D32">SS</text>
  </g>
  <!-- shorts -->
  <g transform="translate(160,400)">
    <path d="M0 0h160v70l-24 90h-46l-10-60-10 60H34L0 70z" fill="#242044"/>
    <rect x="0" y="0" width="160" height="16" fill="#D2EF50"/>
  </g>
  <!-- track pants -->
  <g transform="translate(360,380)">
    <path d="M0 0h110v40l14 200h-40l-29-130-29 130H-14L0 40z" fill="#245D32"/>
    <rect x="0" y="0" width="110" height="14" fill="#D2EF50"/>
    <path d="M8 60h94" stroke="#D2EF50" stroke-width="6"/>
  </g>
  <!-- fabric swatch -->
  <g transform="translate(80,430)">
    <rect width="70" height="70" rx="8" fill="#FFFFFF" stroke="#D6D5D9" stroke-width="3"/>
    <path d="M12 20h46M12 35h46M12 50h46" stroke="#245D32" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="300" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#FFFFFF">Jersey · Shorts · Track pants</text>
</svg>
