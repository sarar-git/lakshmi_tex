<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Viewport test harness</title>
<style>
  body { margin: 0; background: #444; font-family: monospace; color: #fff; }
  #bar { padding: 6px 10px; font-size: 13px; background: #222; }
  iframe { display: block; border: 0; width: 100%; background: #fff; }
</style>
</head>
<body>
<div id="bar">loading…</div>
<iframe id="f" src="about:blank"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const w = parseInt(params.get("w") || "1440", 10);
  const path = params.get("path") || "/products";
  const f = document.getElementById("f");
  f.style.width = w + "px";
  f.style.height = "1200px";
  f.src = path;
  f.onload = function () {
    document.getElementById("bar").textContent = "viewport " + w + "px → " + path;
    // Fit iframe to full page height (bounded)
    try {
      const h = Math.min(f.contentDocument.documentElement.scrollHeight, 30000);
      f.style.height = h + "px";
    } catch (e) {}
  };
</script>
</body>
</html>
